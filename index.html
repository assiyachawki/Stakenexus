<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --dark: #0A0F1E; --dark2: #111827; --dark3: #1E293B;
  --purple: #7C3AED; --cyan: #06B6D4; --green: #10B981;

}

body { font-family: 'Outfit', sans-serif; background: var(--dark); color: var(--white); overflow-x: hidden; font-size: 17px; line-height: 1.75; }

/* NAV */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; height: 100px; background: rgba(10,15,30,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(31,45,69,0.8); }

  align-items: center;
}

  .hero-logo {

}

/* SECTIONS */
section { position: relative; z-index: 1; }

/* HERO */
.hero { min-height: 100vh; display: flex; align-items: center; padding: 120px 60px 80px; max-width: 1200px; margin: 0 auto; }
.hero-content { display: flex; align-items: flex-start; gap: 60px; max-width: 1200px; }.hero-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); border-radius: 50px; padding: 6px 16px; font-size: 0.78rem; color: var(--purple); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 28px; animation: fadeUp 0.8s ease both; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 6vw, 5.5rem); letter-spacing: 0.04em; line-height: 0.95; margin-bottom: 24px; animation: fadeUp 0.8s 0.1s ease both; }

.btn-outline { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: var(--cyan); padding: 14px 28px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; text-decoration: none; border: 1px solid rgba(6,182,212,0.4); transition: all 0.2s; }

.hero-stats { display: flex; gap: 48px; animation: fadeUp 0.8s 0.4s ease both; }
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; background: linear-gradient(135deg, var(--purple), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
.stat-label { font-size: 0.72rem; color: var(--gray); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

/* SECTION COMMON */
.section-tag { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--purple); font-weight: 700; margin-bottom: 16px; }

.section-subtitle { font-size: 1.08rem; color: var(--gray); line-height: 1.8; max-width: 560px; margin-bottom: 60px; }

/* PROBLEM */
.problem { padding: 120px 60px; max-width: 1200px; margin: 0 auto; }
.problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }

.feature-desc { font-size: 0.97rem; color: var(--gray); line-height: 1.7; }

/* SCIENCE */

/* ABOUT TOGGLE */

.about-toggle { display: flex; background: var(--dark2); border: 1px solid var(--border); border-radius: 14px; padding: 4px; max-width: 360px; position: relative; margin-bottom: 48px; }
.about-pill { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); background: linear-gradient(135deg, #7C3AED, #5B21B6); border-radius: 11px; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 4px 14px rgba(124,58,237,0.3); z-index: 0; }

.about-tab-btn { flex: 1; border: none; background: transparent; cursor: pointer; padding: 11px 20px; font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #475569; position: relative; z-index: 1; transition: color 0.25s; }

/* ABOUT FONDATRICE */
.founder-card { background: linear-gradient(135deg, var(--dark2), var(--dark3)); border: 1px solid var(--border); border-radius: 20px; padding: 36px; display: flex; gap: 32px; align-items: center; margin-bottom: 24px; }

/* PRICING */
.pricing-section { padding: 120px 60px; background: linear-gradient(180deg, transparent, rgba(6,182,212,0.03), transparent); }
.pricing-inner { max-width: 1100px; margin: 0 auto; }

.form-textarea:focus { border-color: var(--purple); }
.form-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #7C3AED, #5B21B6); border: none; border-radius: 10px; color: white; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s; box-shadow: 0 6px 20px rgba(124,58,237,0.3); }
.form-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(124,58,237,0.4); }
.form-success { display: none; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); border-radius: 10px; padding: 14px 18px; color: var(--green); font-size: 0.88rem; margin-top: 12px; text-align: center; }

/* CTA */
.cta-section { padding: 100px 60px; text-align: center; position: relative; }
.cta-inner { max-width: 700px; margin: 0 auto; }
.cta-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 600px; height: 300px; background: radial-gradient(ellipse, rgba(124,58,237,0.12) 0%, transparent 70%); pointer-events: none; }
.cta-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 5vw, 4rem); letter-spacing: 0.04em; line-height: 1.05; margin-bottom: 20px; }
.cta-subtitle { color: var(--gray); font-size: 1rem; line-height: 1.7; margin-bottom: 40px; }
.cta-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

/* FOOTER */
footer { border-top: 1px solid var(--border); padding: 40px 60px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
.footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.08em; color: var(--gray); }
.footer-text { font-size: 0.8rem; color: #334155; }
.footer-links { display: flex; gap: 24px; }
.footer-links a { font-size: 0.8rem; color: #334155; text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--gray); }

/* ANIMATIONS */
@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* MOBILE TYPOGRAPHY */
@media (max-width: 768px) {
  body { line-height: 1.5; }
  p, .feature-desc, .problem-desc, .section-subtitle, .contact-card-desc, .founder-pos, .science-item { line-height: 1.5 !important; margin-bottom: 12px !important; }
  h2.section-title { font-size: 28px !important; }
}

/* RESPONSIVE */
@media (max-width: 900px) {
  nav { padding: 0 24px; }
  .nav-links { display: none; }
  .hero { padding: 100px 24px 60px; }
  .hero-stats { gap: 28px; }
  .hero-actions { flex-direction: column; }
  .problem { padding: 80px 24px; }
  .problem-grid { grid-template-columns: 1fr; }
  .solution-section { padding: 80px 24px; }
  .features-grid { grid-template-columns: 1fr; }
  .science-section { padding: 80px 24px; }
  .science-grid { grid-template-columns: 1fr; gap: 32px; }
  .about-section { padding: 80px 24px; }
  .sw-grid { grid-template-columns: 1fr; }
  .founder-card { flex-direction: column; text-align: center; }
  .founder-stats { flex-wrap: wrap; }
  .mission-grid { grid-template-columns: 1fr; }
  .pricing-section { padding: 80px 24px; }
  .pricing-grid { grid-template-columns: 1fr; }
  .contact-section { padding: 80px 24px; }
  .contact-grid { grid-template-columns: 1fr; gap: 40px; }
  .cta-section { padding: 80px 24px; }
  footer { padding: 32px 24px; flex-direction: column; gap: 16px; text-align: center; }
}

/* TESTIMONIES */
.testimonies-section { padding: 120px 60px; max-width: 1200px; margin: 0 auto; }
.testimonies-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 60px; }
.testimony-card { background: var(--dark2); border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px; position: relative; transition: transform 0.2s, border-color 0.2s; }
.testimony-card:hover { transform: translateY(-4px); border-color: rgba(124,58,237,0.4); }
.testimony-card::before { content: '\201C'; position: absolute; top: 20px; right: 28px; font-size: 5rem; line-height: 1; color: rgba(124,58,237,0.15); font-family: Georgia, serif; }
.testimony-stars { display: flex; gap: 4px; }
.testimony-star { color: var(--yellow); font-size: 1rem; }
.testimony-text { font-size: 1.0rem; color: #CBD5E1; line-height: 1.85; font-style: italic; flex: 1; }
.testimony-author { display: flex; align-items: center; gap: 14px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06); }
.testimony-avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: white; flex-shrink: 0; }
.testimony-name { font-weight: 700; font-size: 0.92rem; color: var(--white); margin-bottom: 2px; }
.testimony-role { font-size: 0.78rem; color: var(--gray); }
.testimony-org { font-size: 0.72rem; color: var(--purple); font-weight: 600; margin-top: 2px; }
@media (max-width: 900px) { .testimonies-section { padding: 80px 24px; } .testimonies-grid { grid-template-columns: 1fr; } }

/* PLATFORM PREVIEW */
.preview-section { padding: 120px 60px; background: linear-gradient(180deg, transparent, rgba(124,58,237,0.05), transparent); }
.preview-inner { max-width: 1200px; margin: 0 auto; }
.preview-browser { background: var(--dark2); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,58,237,0.1); margin-top: 60px; }
.preview-bar { background: #1E293B; padding: 14px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
.preview-dots { display: flex; gap: 7px; }
.preview-dot { width: 12px; height: 12px; border-radius: 50%; }
.preview-dot.red { background: #EF4444; }
.preview-dot.yellow { background: #F59E0B; }
.preview-dot.green { background: #10B981; }
.preview-url { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; padding: 5px 14px; font-size: 0.74rem; color: var(--gray); margin-left: 12px; font-family: monospace; flex: 1; max-width: 400px; }
.preview-content { padding: 40px; }
.preview-dashboard { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.preview-metric { background: var(--dark3); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
.preview-metric-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); margin-bottom: 8px; }
.preview-metric-val { font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem; line-height: 1; margin-bottom: 4px; }
.preview-metric-delta { font-size: 0.72rem; color: var(--green); font-weight: 600; }
.preview-matrix { background: var(--dark3); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 16px; }
.preview-matrix-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); margin-bottom: 16px; }
.preview-matrix-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.preview-node { border-radius: 10px; padding: 10px 8px; text-align: center; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.preview-node.high { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; }
.preview-node.med { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); color: #FCD34D; }
.preview-node.low { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #6EE7B7; }
.preview-ask { background: linear-gradient(135deg, rgba(124,58,237,0.1), rgba(6,182,212,0.05)); border: 1px solid rgba(124,58,237,0.3); border-radius: 14px; padding: 20px 24px; }
.preview-ask-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--purple); margin-bottom: 10px; }
.preview-ask-q { font-size: 0.82rem; color: #94A3B8; margin-bottom: 10px; font-style: italic; }
.preview-ask-a { font-size: 0.82rem; color: var(--white); line-height: 1.6; }
.preview-ask-a strong { color: var(--cyan); }
@media (max-width: 900px) { .preview-section { padding: 80px 24px; } .preview-dashboard { grid-template-columns: 1fr; } .preview-matrix-grid { grid-template-columns: repeat(2,1fr); } }


/* TESTIMONY LOCKED/REVEAL */
.testimony-locked { cursor: pointer; position: relative; }
.testimony-locked:hover { border-color: rgba(124,58,237,0.5); box-shadow: 0 0 0 1px rgba(124,58,237,0.2); }
.testimony-lock-badge { display: inline-block; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 4px 12px; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #64748B; margin-bottom: 20px; }
.testimony-locked.revealed .testimony-lock-badge { display: none; }
.testimony-blur-line { height: 12px; background: rgba(255,255,255,0.08); border-radius: 6px; margin-bottom: 10px; }
.testimony-blurred-content { }
.testimony-locked.revealed .testimony-blurred-content { display: none; }
.testimony-revealed-content { }
.testimony-locked.revealed .testimony-revealed-content { display: block !important; animation: fadeUp 0.4s ease both; }
